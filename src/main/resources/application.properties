spring.application.name=licoreria

# Carpeta externa de im\u00e1genes (usada por WebConfig).
# Sin definir aqu\u00ed: usa el valor por defecto portable ${user.dir}/images/
# (carpeta images/ en la ra\u00edz del proyecto), igual en Windows, Linux o macOS.
app.imagenes.url=/images/

# Conexi\u00f3n a la BD
spring.datasource.url=jdbc:mysql://localhost:3306/licoreria_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081
spring.thymeleaf.cache=false

app.base-url=http://localhost:8081

# Métodos de pago (Yape / Efectivo)
# Número Yape 
app.pago.yape.numero=51977968942
# Nombre que aparece en la app Yape
app.pago.yape.nombre=Tu Licoreria

# Pasarela de pago con tarjeta  Culqi 
#culqi.secret-key=skCLAVE

# ── Carrito / Checkout ─────────────────────────────────────────────────────
#envío gratis
app.carrito.pedido-minimo=50.00

# ── WhatsApp ───────────────────────────────────────────────────────────────
# Número
app.whatsapp.numero=51977968942
app.whatsapp.mensaje=Hola,%20deseo%20informaci\u00f3n%20sobre%20sus%20productos

