spring.application.name=licoreria

# Carpeta externa de im\u00e1genes (usada por WebConfig)
app.imagenes.ruta=C:/licoreria/images/
app.imagenes.url=/images/

# Conexi\u00f3n a la BD
spring.datasource.url=jdbc:mysql://localhost:3307/licoreria_db1
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.hbm2ddl.import_files=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

spring.thymeleaf.cache=false


