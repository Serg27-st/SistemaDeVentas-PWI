spring.application.name=licoreria

# Carpeta externa de im\u00e1genes (usada por WebConfig)
app.imagenes.ruta=C:/licoreria/images/
app.imagenes.url=/images/

# Conexi\u00f3n a la BD
spring.datasource.url=jdbc:mysql://localhost:3306/licoreria_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.hbm2ddl.import_files=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081
#spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.thymeleaf.cache=false

