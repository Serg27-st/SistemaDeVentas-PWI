<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{admin/layout :: layout(
          titulo='Detalle de Venta',
          currentPage='ventas',
          content=~{::main-content},
          extraHead=~{},
          extraScripts=~{})}">
<head>
</head>
<body>
<th:block th:fragment="main-content">
 
    <!-- Cabecera -->
    <div class="d-flex justify-content-between align-items-start mb-4 flex-wrap gap-3">
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/ventas}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i>
            </a>
            <div>
                <h4 class="page-title mb-0" th:text="${venta.numeroComprobante}"></h4>
                <p class="text-muted mb-0 small"
                   th:text="${venta.tipoComprobante + ' · ' +
                              #temporals.format(venta.fechaHora,'dd/MM/yyyy HH:mm')}">
                </p>
            </div>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/ventas/{id}/comprobante(id=${venta.id})}"
               class="btn btn-outline-primary btn-sm" target="_blank">
                <i class="bi bi-printer me-1"></i>Imprimir
            </a>
            <form th:if="${venta.estado == 'COMPLETADA'}"
                  th:action="@{/ventas/{id}/anular(id=${venta.id})}"
                  method="post"
                  onsubmit="return confirm('¿Anular esta venta? El stock será devuelto.')">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline-danger btn-sm">
                    <i class="bi bi-x-circle me-1"></i>Anular
                </button>
            </form>
        </div>
    </div>
 
    <div class="row g-4">
 
        <!-- Info principal -->
        <div class="col-lg-4">
 
            <!-- Estado -->
            <div class="card border-0 shadow-sm mb-3">
                <div class="card-body p-4 text-center">
                    <div th:switch="${venta.estado}">
                        <div th:case="'COMPLETADA'">
                            <i class="bi bi-check-circle-fill text-success fs-1"></i>
                            <div class="fw-bold fs-5 mt-2 text-success">Completada</div>
                        </div>
                        <div th:case="'ANULADA'">
                            <i class="bi bi-x-circle-fill text-danger fs-1"></i>
                            <div class="fw-bold fs-5 mt-2 text-danger">Anulada</div>
                        </div>
                        <div th:case="'PENDIENTE'">
                            <i class="bi bi-hourglass-split text-warning fs-1"></i>
                            <div class="fw-bold fs-5 mt-2 text-warning">Pendiente</div>
                        </div>
                    </div>
                    <div class="text-muted small mt-1"
                         th:text="${#temporals.format(venta.fechaHora,'dd MMM yyyy, HH:mm')}">
                    </div>
                </div>
            </div>
 
            <!-- Datos -->
            <div class="card border-0 shadow-sm mb-3">
                <div class="card-header bg-white border-bottom py-3">
                    <h6 class="mb-0 fw-semibold">
                        <i class="bi bi-info-circle me-2 text-warning"></i>Datos
                    </h6>
                </div>
                <div class="card-body p-0">
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between px-4">
                            <small class="text-muted">Comprobante</small>
                            <span class="fw-semibold small"
                                  th:text="${venta.numeroComprobante}"></span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between px-4">
                            <small class="text-muted">Tipo</small>
                            <span class="badge bg-secondary"
                                  th:text="${venta.tipoComprobante}"></span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between px-4">
                            <small class="text-muted">Método de pago</small>
                            <span class="fw-semibold small"
                                  th:text="${venta.metodoPago}"></span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between px-4">
                            <small class="text-muted">Vendedor</small>
                            <span class="fw-semibold small"
                                  th:text="${venta.vendedorNombre}"></span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between px-4">
                            <small class="text-muted">Cliente</small>
                            <span class="fw-semibold small"
                                  th:text="${venta.clienteNombre}"></span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between px-4"
                            th:if="${venta.clienteDocumento != '-'}">
                            <small class="text-muted">Documento</small>
                            <span class="small"
                                  th:text="${venta.clienteDocumento}"></span>
                        </li>
                    </ul>
                </div>
            </div>
 
            <!-- Totales -->
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Subtotal</span>
                        <span th:text="'S/. ' + ${#numbers.formatDecimal(venta.subtotal,1,2)}"></span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">IGV (18%)</span>
                        <span th:text="'S/. ' + ${#numbers.formatDecimal(venta.igv,1,2)}"></span>
                    </div>
                    <hr/>
                    <div class="d-flex justify-content-between fw-bold fs-5">
                        <span>Total</span>
                        <span class="text-warning"
                              th:text="'S/. ' + ${#numbers.formatDecimal(venta.total,1,2)}">
                        </span>
                    </div>
                </div>
            </div>
        </div>
 
        <!-- Detalle de productos -->
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-dark text-white border-0 py-3">
                    <h6 class="mb-0 fw-semibold">
                        <i class="bi bi-box-seam me-2"></i>
                        Productos vendidos
                        <span class="badge bg-warning text-dark ms-2"
                              th:text="${#lists.size(venta.detalles)}"></span>
                    </h6>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead class="bg-light">
                                <tr>
                                    <th class="ps-4">Producto</th>
                                    <th class="text-center">Cant.</th>
                                    <th class="text-end">P. Unit.</th>
                                    <th class="text-center">Descuento</th>
                                    <th class="text-end pe-4">Subtotal</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="d : ${venta.detalles}">
                                    <td class="ps-4">
                                        <div class="fw-semibold"
                                             th:text="${d.productoNombre}"></div>
                                        <small class="text-muted"
                                               th:text="${d.productoMarca + ' · ' + d.volumenMl + 'ml'}">
                                        </small>
                                    </td>
                                    <td class="text-center fw-semibold"
                                        th:text="${d.cantidad}"></td>
                                    <td class="text-end"
                                        th:text="'S/. ' + ${#numbers.formatDecimal(d.precioUnitario,1,2)}">
                                    </td>
                                    <td class="text-center">
                                        <span th:if="${d.descuentoPorcentaje > 0}"
                                              class="badge bg-success"
                                              th:text="${d.descuentoPorcentaje + '%'}"></span>
                                        <span th:if="${d.descuentoPorcentaje == 0}"
                                              class="text-muted">—</span>
                                    </td>
                                    <td class="text-end pe-4 fw-bold"
                                        th:text="'S/. ' + ${#numbers.formatDecimal(d.subtotal,1,2)}">
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
 
                <!-- Observaciones -->
                <div class="card-footer bg-white border-top p-4"
                     th:if="${venta.observaciones != null and !#strings.isEmpty(venta.observaciones)}">
                    <small class="text-muted d-block mb-1">Observaciones</small>
                    <span th:text="${venta.observaciones}"></span>
                </div>
            </div>
        </div>
    </div>
 
</th:block>
</body>
</html>
