<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${venta?.numeroComprobante != null ? venta.numeroComprobante : 'Comprobante'}">Comprobante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link th:href="@{/css/comprobante.css}" rel="stylesheet" />
</head>

<body>

    <div>
        <div class="text-center mb-3 btn-imprimir">
            <button onclick="window.print()" class="btn btn-dark btn-sm me-2">
                <i class="bi bi-printer me-1"></i>Imprimir
            </button>
            <a th:href="@{/ventas/{id}(id=${venta?.id})}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
        </div>

        <div class="ticket">

            <div class="ticket-header">
                <div class="ticket-logo">🥃 LICORERÍA</div>
                <div class="ticket-ruc">RUC: 20512345678</div>
                <div class="ticket-ruc">Av. Principal 123, Lima</div>
                <div class="ticket-ruc">Tel: +51 999 999 999</div>

                <div th:if="${venta?.estado == 'ANULADA'}" class="badge-estado anulada mt-2">
                    ⚠ COMPROBANTE ANULADO
                </div>

                <div class="ticket-tipo mt-2" th:text="${venta?.tipoComprobante}">BOLETA</div>
                <div class="ticket-numero" th:text="${venta?.numeroComprobante}"></div>
            </div>

            <div class="ticket-section">
                <div class="ticket-row">
                    <span class="ticket-label">Fecha:</span>
                    <span class="ticket-value"
                        th:text="${venta?.fechaHora != null ? #temporals.format(venta.fechaHora, 'dd/MM/yyyy HH:mm') : ''}">
                    </span>
                </div>
                <div class="ticket-row">
                    <span class="ticket-label">Cliente:</span>
                    <span class="ticket-value"
                        th:text="${venta?.clienteNombre != null ? venta.clienteNombre : 'Cliente Anónimo'}"></span>
                </div>
                <div class="ticket-row" th:if="${venta?.clienteDocumento != null && venta.clienteDocumento != '-'}">
                    <span class="ticket-label">Documento:</span>
                    <span class="ticket-value" th:text="${venta.clienteDocumento}"></span>
                </div>
                <div class="ticket-row">
                    <span class="ticket-label">Vendedor:</span>
                    <span class="ticket-value" th:text="${venta?.vendedorNombre}"></span>
                </div>
                <div class="ticket-row">
                    <span class="ticket-label">Pago:</span>
                    <span class="ticket-value" th:text="${venta?.metodoPago}"></span>
                </div>
            </div>

            <div class="ticket-items">
                <div th:each="d : ${venta?.detalles}" class="ticket-item">
                    <div>
                        <div class="item-nombre" th:text="${d.productoNombre}"></div>
                        <div class="item-detalle"
                            th:text="${d.descuentoPorcentaje > 0} 
                                  ? |${d.cantidad} x S/. ${#numbers.formatDecimal(d.precioUnitario, 1, 'COMMA', 2, 'POINT')} (-${d.descuentoPorcentaje}%)| 
                                  : |${d.cantidad} x S/. ${#numbers.formatDecimal(d.precioUnitario, 1, 'COMMA', 2, 'POINT')}|">
                        </div>
                    </div>
                    <div class="item-precio fw-semibold"
                        th:text="|S/. ${#numbers.formatDecimal(d.subtotal, 1, 'COMMA', 2, 'POINT')}|">
                    </div>
                </div>
            </div>

            <div class="ticket-totales">
                <div class="ticket-row">
                    <span class="ticket-label">Subtotal:</span>
                    <span
                        th:text="|S/. ${#numbers.formatDecimal(venta?.subtotal != null ? venta.subtotal : 0, 1, 'COMMA', 2, 'POINT')}|"></span>
                </div>
                <div class="ticket-row">
                    <span class="ticket-label">IGV (18%):</span>
                    <span
                        th:text="|S/. ${#numbers.formatDecimal(venta?.igv != null ? venta.igv : 0, 1, 'COMMA', 2, 'POINT')}|"></span>
                </div>
                <div class="ticket-row total-final">
                    <span>TOTAL:</span>
                    <span
                        th:text="|S/. ${#numbers.formatDecimal(venta?.total != null ? venta.total : 0, 1, 'COMMA', 2, 'POINT')}|"></span>
                </div>
            </div>

            <div class="ticket-footer">
                <p class="mb-1">¡Gracias por su compra!</p>
                <p class="mb-1">Recuerde: Venta solo para mayores de 18 años</p>
                <p class="mb-0">www.licoreria.com</p>
            </div>
        </div>
    </div>

    <script>
        // Auto-imprimir al abrir la página de manera limpia
        window.addEventListener('load', () => {
            setTimeout(() => {
                window.print();
            }, 500);
        });
    </script>
</body>

</html>
