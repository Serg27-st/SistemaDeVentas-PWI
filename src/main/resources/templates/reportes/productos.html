<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(
          titulo='Reporte por Producto | Licorería',
          currentPage='reporte-productos',
          content=~{::main-content},
          extraHead=null,
          extraScripts=~{::extraScripts})}">

<head>
    <title>Reporte por Producto</title>
</head>

<body>

    <th:block th:fragment="main-content">

        <div class="d-flex justify-content-between align-items-start mb-4 flex-wrap gap-3">
            <div class="d-flex align-items-center gap-3">
                <a th:href="@{/reportes}" class="btn btn-outline-secondary btn-sm rounded-circle">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <div>
                    <h4 class="fw-bold mb-1" style="color: var(--text-main);">Ventas por producto</h4>
                    <p class="text-muted mb-0 small">
                        Productos más vendidos —
                        <span th:text="${reporte.nombreMes + ' ' + reporte.anio}" class="fw-semibold text-dark"></span>
                    </p>
                </div>
            </div>

            <form th:action="@{/reportes/productos}" method="get" class="d-flex gap-2 align-items-center">
                <select name="mes" class="form-select form-select-sm shadow-sm" style="width:130px">
                    <option th:each="m : ${#numbers.sequence(1,12)}" th:value="${m}" th:selected="${m == mes}"
                        th:text="${#temporals.format(#temporals.create(2026,m,1),'MMMM')}">
                    </option>
                </select>
                <select name="anio" class="form-select form-select-sm shadow-sm" style="width:90px">
                    <option th:each="a : ${#numbers.sequence(2024,2026)}" th:value="${a}" th:selected="${a == anio}"
                        th:text="${a}">
                    </option>
                </select>
                <button type="submit" class="btn btn-primary btn-sm fw-semibold shadow-sm"
                    style="background-color: var(--accent-blue); border:none;">
                    <i class="bi bi-search me-1"></i>Consultar
                </button>
            </form>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <i class="bi bi-box-seam icon text-warning" style="background-color: #fffbeb;"></i>
                    <div class="value" th:text="${reporte.totalProductosVendidos}">0</div>
                    <div class="label">Productos vendidos</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <i class="bi bi-boxes icon text-primary" style="background-color: #eff6ff;"></i>
                    <div class="value" th:text="${reporte.totalUnidades}">0</div>
                    <div class="label">Unidades despachadas</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <i class="bi bi-cash-stack icon text-success" style="background-color: #f0fdf4;"></i>
                    <div class="value" th:text="'S/. ' + ${#numbers.formatDecimal(reporte.totalIngresos,1,2)}">S/. 0.00
                    </div>
                    <div class="label">Ingresos totales</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <i class="bi bi-trophy icon text-danger" style="background-color: #fef2f2;"></i>
                    <div class="value"
                        style="font-size: 1.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"
                        th:text="${!#lists.isEmpty(reporte.productos) ?
                               (reporte.productos[0].nombre.length() > 14 ?
                               #strings.substring(reporte.productos[0].nombre,0,14) + '...' :
                               reporte.productos[0].nombre) : '-'}">-</div>
                    <div class="label">Más vendido</div>
                </div>
            </div>
        </div>

        <div class="card-dark p-0 overflow-hidden">
            <div class="border-bottom px-4 py-3 bg-white">
                <h6 class="fw-bold mb-0" style="color: var(--text-main);">
                    <i class="bi bi-bar-chart me-2 text-primary"></i>
                    Ranking de productos —
                    <span th:text="${reporte.nombreMes + ' ' + reporte.anio}"></span>
                </h6>
            </div>

            <div th:if="${#lists.isEmpty(reporte.productos)}" class="text-center py-5 text-muted bg-white">
                <i class="bi bi-box-seam fs-2 d-block mb-2"></i>
                No hubo ventas en este período
            </div>

            <div class="table-responsive" th:if="${!#lists.isEmpty(reporte.productos)}">
                <table class="table align-middle mb-0" style="background-color: #ffffff;">
                    <thead style="background-color: #f8fafc; border-bottom: 1px solid var(--border-soft);">
                        <tr>
                            <th class="ps-4 text-muted small fw-bold" style="width:70px;">#</th>
                            <th class="text-muted small fw-bold">Producto</th>
                            <th class="text-muted small fw-bold">Categoría</th>
                            <th class="text-center text-muted small fw-bold">Unidades</th>
                            <th class="text-end text-muted small fw-bold">Ingresos</th>
                            <th class="text-center text-muted small fw-bold">Stock actual</th>
                            <th class="text-end pe-4 text-muted small fw-bold" style="width: 160px;">% Ingresos</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="prod, iter : ${reporte.productos}"
                            style="border-bottom: 1px solid var(--border-soft);">

                            <td class="ps-4">
                                <span th:if="${iter.index == 0}" class="fs-5" title="1er Puesto">🥇</span>
                                <span th:if="${iter.index == 1}" class="fs-5" title="2do Puesto">🥈</span>
                                <span th:if="${iter.index == 2}" class="fs-5" title="3er Puesto">🥉</span>
                                <span th:if="${iter.index > 2}" class="text-muted fw-semibold ms-2"
                                    th:text="${iter.index + 1}"></span>
                            </td>

                            <td>
                                <div class="d-flex align-items-center gap-3">
                                    <div class="producto-thumb-sm rounded shadow-sm border overflow-hidden"
                                        style="width: 42px; height: 42px; background: #fff;">
                                        <img th:src="@{/images/productos/{id}.jpg(id=${prod.productoId})}"
                                            th:alt="${prod.nombre}"
                                            style="width: 100%; height: 100%; object-fit: contain;"
                                            onerror="this.src='/images/producto-default.png'" />
                                    </div>
                                    <div>
                                        <div class="fw-semibold" style="color: var(--text-main);"
                                            th:text="${prod.nombre}"></div>
                                        <small class="text-muted"
                                            th:text="${prod.marca + ' · ' + prod.volumenMl + 'ml'}"></small>
                                    </div>
                                </div>
                            </td>

                            <td>
                                <span class="badge" style="background-color: #f1f5f9; color: #475569; font-weight: 500;"
                                    th:text="${prod.categoria}"></span>
                            </td>

                            <td class="text-center">
                                <span class="badge"
                                    style="background-color: #eff6ff; color: var(--accent-blue); font-size: 0.85rem; font-weight: 600;"
                                    th:text="${prod.unidadesVendidas}"></span>
                            </td>

                            <td class="text-end fw-bold" style="color: var(--text-main);"
                                th:text="'S/. ' + ${#numbers.formatDecimal(prod.ingresos,1,2)}">
                            </td>

                            <td class="text-center">
                                <span th:text="${prod.stockActual}" th:class="${prod.stockActual == 0 ? 'badge bg-danger-subtle text-danger' :
                                             (prod.stockActual <= 5 ? 'badge bg-warning-subtle text-warning-emphasis' :
                                             'text-success fw-semibold')}"
                                    th:style="${prod.stockActual <= 5 ? 'font-size: 0.85rem;' : ''}">
                                </span>
                            </td>

                            <td class="text-end pe-4">
                                <div class="d-flex align-items-center justify-content-end gap-2">
                                    <div class="progress flex-grow-1"
                                        style="height:6px; max-width:70px; background-color: #e2e8f0;">
                                        <div class="progress-bar bg-primary"
                                            th:style="'width:' + ${reporte.totalIngresos.compareTo(T(java.math.BigDecimal).ZERO) > 0 ?
                                             prod.ingresos.multiply(T(java.math.BigDecimal).valueOf(100))
                                             .divide(reporte.totalIngresos,0,T(java.math.RoundingMode).HALF_UP) : 0} + '%'">
                                        </div>
                                    </div>
                                    <small class="text-muted fw-semibold" style="min-width: 38px;" th:text="${reporte.totalIngresos.compareTo(T(java.math.BigDecimal).ZERO) > 0 ?
                                           prod.ingresos.multiply(T(java.math.BigDecimal).valueOf(100))
                                           .divide(reporte.totalIngresos,1,T(java.math.RoundingMode).HALF_UP) + '%'
                                           : '0%'}">
                                    </small>
                                </div>
                            </td>
                        </tr>
                    </tbody>

                    <tfoot style="background-color: #f8fafc; border-top: 2px solid #e2e8f0;">
                        <tr>
                            <td colspan="3" class="ps-4 fw-bold" style="color: var(--text-main);">Total General</td>
                            <td class="text-center fw-bold text-primary" th:text="${reporte.totalUnidades}"></td>
                            <td class="text-end fw-bold text-success fs-6"
                                th:text="'S/. ' + ${#numbers.formatDecimal(reporte.totalIngresos,1,2)}">
                            </td>
                            <td colspan="2" class="text-end pe-4 fw-bold text-muted small">100% del Periodo</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>

    </th:block>

    <th:block th:fragment="extraScripts">
        <script>
            // Envío automático al modificar los filtros de búsqueda
            document.querySelectorAll('select[name="mes"], select[name="anio"]')
                .forEach(sel => sel.addEventListener('change', () => sel.form.submit()));
        </script>
    </th:block>

</body>

</html>
