<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{admin/layout :: layout(
          titulo=${categoria != null and categoria.id != null ? 'Editar Categoría' : 'Nueva Categoría'},
          currentPage='categorias',
          content=~{::main-content},
          extraHead=~{},
          extraScripts=~{::scripts})}">
<head>
    <title th:text="${categoria != null and categoria.id != null ? 'Editar Categoría' : 'Nueva Categoría'}">Formulario de Categoría</title>
</head>
<body>
<main th:fragment="main-content">

    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="@{/categorias}" class="btn btn-light border btn-sm text-secondary shadow-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <div>
        <h4 class="fw-bold mb-0" style="color: var(--text-main);" th:text="${categoria != null and categoria.id != null ? 'Editar Categoría' : 'Nueva Categoría'}">
            Formulario de Categoría
        </h4>
            <p class="text-muted mb-0 small">Administra categorías del catálogo</p>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card border-0 shadow-sm bg-white mb-4">
                <div class="card-header border-0 py-3 bg-white"
                     style="border-bottom: 1px solid var(--border-soft) !important;">
                    <h6 class="mb-0 fw-bold" style="color: var(--text-main);">
                        <i class="bi bi-tags-fill me-2 text-primary"></i>Datos de la Categoría
                    </h6>
                </div>

                <div class="card-body p-4">
        <form
                        th:action="${categoria != null and categoria.id != null} ? @{/categorias/editar/{id}(id=${categoria.id})} : @{/categorias/nueva}"
                        th:object="${categoria}"
                        method="post"
                        id="formCategoria"
                        novalidate>

                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <input type="hidden" th:if="${id != null}" name="id" th:value="${id}" />

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small text-secondary">
                                    Nombre <span class="text-danger">*</span>
                                </label>
                                <input type="text"
                                       class="form-control bg-light border-0"
                                       th:field="*{nombre}"
                                       placeholder="Ej: Ron, Cerveza, Vinos..."
                                       required />
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold small text-secondary">
                                    Descripción
                                </label>
                                <input type="text"
                                       class="form-control bg-light border-0"
                                       th:field="*{descripcion}"
                                       placeholder="Opcional" />
                            </div>
                        </div>

                        <div class="d-flex gap-2 justify-content-end border-top pt-4 mt-4"
                             style="border-top: 1px solid var(--border-soft) !important;">
                            <a th:href="@{/categorias}"
                               class="btn btn-light border text-secondary fw-semibold btn-sm px-3">
                                Cancelar
                            </a>

                            <button sec:authorize="hasRole('ADMIN')"
                                    type="submit"
                                    class="btn btn-primary fw-semibold btn-sm px-4"
                                    style="background-color: var(--accent-blue); border: none;">
                                <i class="bi bi-check-circle me-1"></i>
                                <span th:text="${categoria != null and categoria.id != null ? 'Actualizar Categoría' : 'Guardar Categoría'}">Guardar</span>
                            </button>
                        </div>

                    </form>
                </div>
            </div>

            <div class="card border-0 shadow-sm"
                 style="background-color: #f8fafc; border-left: 4px solid #64748b !important;">
                <div class="card-body p-3">
                    <p class="mb-0 text-muted small" style="font-size: 0.78rem; line-height: 1.3;">
                        <i class="bi bi-info-circle me-1 text-secondary"></i>
                        <strong>Tip:</strong> Usa nombres claros para facilitar la búsqueda y filtrado en el catálogo.
                    </p>
                </div>
            </div>

        </div>
    </div>

</main>

<th:block th:fragment="scripts">
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const form = document.getElementById('formCategoria');
            form?.addEventListener('submit', function (e) {
                if (!form.checkValidity()) {
                    e.preventDefault();
                    form.classList.add('was-validated');
                }
            });
        });
    </script>
</th:block>

</body>
</html>
