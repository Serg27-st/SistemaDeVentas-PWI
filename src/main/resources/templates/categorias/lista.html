<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{admin/layout :: layout(
          titulo='Categorías',
          currentPage='categorias',
          content=~{::main-content},
          extraHead=~{},
          extraScripts=~{})}">
<head>
</head>
<body>
<main th:fragment="main-content">

    <div class="d-flex align-items-center justify-content-between mb-3">
        <h3 class="m-0">Categorías</h3>
        <a th:href="@{/categorias/nueva}" class="btn btn-amber" sec:authorize="hasRole('ADMIN')">
            <i class="bi bi-plus-lg me-1"></i> Nueva Categoría
        </a>
    </div>

    <div class="card-dark">
        <div class="table-responsive">
            <table class="table table-dark-custom table-hover mb-0">
                <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Estado</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${categorias}">
                    <td th:text="${c.nombre}">Nombre</td>
                    <td th:text="${c.descripcion != null ? c.descripcion : '-'}">-</td>
                    <td>ACTIVO</td>

                    <td class="text-end">
                        <a th:href="@{'/categorias/editar/' + ${c.id}}"
                           class="btn btn-outline-amber btn-sm"
                           sec:authorize="hasRole('ADMIN')">
                            <i class="bi bi-pencil"></i>
                        </a>

                        <form th:action="@{'/categorias/desactivar/' + ${c.id}}" method="post"
                              style="display:inline-block;"
                              sec:authorize="hasRole('ADMIN')"
                              onsubmit="return confirm('¿Desactivar esta categoría?')">
                            <button type="submit" class="btn btn-outline-danger btn-sm ms-1">
                                <i class="bi bi-x-circle"></i>
                            </button>
                        </form>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(categorias)}">
                    <td colspan="4" class="text-center text-muted py-4">No hay categorías.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>
</body>
</html>
