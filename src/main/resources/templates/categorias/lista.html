<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
    th:replace="~{admin/layout :: layout(
          titulo='Mantenimiento de Categorías | Licorería',
          currentPage='categorias',
          content=~{::main-content},
          extraHead=null,
          extraScripts=~{::extraScripts})}">

<head>
    <title>Categorías</title>
</head>

<body>

    <th:block th:fragment="main-content">

        <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-3">
            <div>
                <h4 class="fw-bold mb-1" style="color: var(--text-main);">Categorías</h4>
                <p class="text-muted mb-0 small">Administra las categorías de licores disponibles en el sistema.</p>
            </div>
            <a th:href="@{/categorias/nueva}" class="btn btn-primary btn-sm fw-semibold shadow-sm px-3"
                sec:authorize="hasRole('ADMIN')" style="background-color: var(--accent-blue); border: none;">
                <i class="bi bi-plus-lg me-1"></i> Nueva Categoría
            </a>
        </div>

        <div class="card-dark p-0 overflow-hidden shadow-sm">
            <div class="table-responsive">
                <table class="table align-middle mb-0" style="background-color: #ffffff;">
                    <thead style="background-color: #f8fafc; border-bottom: 1px solid var(--border-soft);">
                        <tr>
                            <th class="ps-4 text-muted small fw-bold" style="width: 250px;">Nombre</th>
                            <th class="text-muted small fw-bold">Descripción</th>
                            <th class="text-center text-muted small fw-bold" style="width: 140px;">Estado</th>
                            <th class="text-end pe-4 text-muted small fw-bold" style="width: 150px;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${categorias}" style="border-bottom: 1px solid var(--border-soft);">
                            <td class="ps-4 fw-semibold" style="color: var(--text-main);" th:text="${c.nombre}">Nombre
                            </td>
                            <td class="text-muted"
                                th:text="${c.descripcion != null and !c.descripcion.blank() ? c.descripcion : 'Sin descripción registrada'}">
                                -</td>

                            <td class="text-center">
                                <span class="badge"
                                    style="background-color: #f0fdf4; color: #16a34a; font-weight: 600; font-size: 0.8rem; padding: 0.35em 0.65em;">
                                    <i class="bi bi-check-circle-fill me-1 small"></i> Activo
                                </span>
                            </td>

                            <td class="text-end pe-4">
                                <div class="d-inline-flex gap-1">
                                    <a th:href="@{'/categorias/editar/' + ${c.id}}"
                                        class="btn btn-light btn-sm border text-secondary shadow-sm"
                                        title="Editar Categoría" style="padding: 0.25rem 0.5rem;">
                                        <i class="bi bi-pencil"></i>
                                    </a>

                                    <form th:action="@{'/categorias/desactivar/' + ${c.id}}" method="post"
                                        class="d-inlineForm delete-form" sec:authorize="hasRole('ADMIN')">
                                        <button type="submit" class="btn btn-outline-danger btn-sm shadow-sm"
                                            title="Desactivar Categoría" style="padding: 0.25rem 0.5rem;">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(categorias)}">
                            <td colspan="4" class="text-center text-muted py-5 bg-white">
                                <i class="bi bi-tag-fill fs-2 d-block mb-2 text-light-emphasis"></i>
                                No hay categorías registradas en el sistema.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </th:block>

    <th:block th:fragment="extraScripts">
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                // Captura todos los formularios de eliminación/desactivación para darles una alerta nativa limpia
                const deleteForms = document.querySelectorAll('.delete-form');
                deleteForms.forEach(form => {
                    form.addEventListener('submit', function (e) {
                        const confirmacion = confirm("¿Estás seguro de que deseas desactivar esta categoría? Los productos asociados podrían verse afectados.");
                        if (!confirmacion) {
                            e.preventDefault(); // Cancela el envío si el usuario se arrepiente
                        }
                    });
                });
            });
        </script>
    </th:block>

</body>

</html>
