<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Iniciar Sesión | Licorería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
    <link th:href="@{/css/login.css}" rel="stylesheet"/>
    
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">

        <!-- Logo -->
        <div class="text-center mb-4">
            <div class="brand-logo">🥃 LICORERÍA</div>
            <div class="brand-sub">Panel Administrativo</div>
        </div>

        <!-- Alertas -->
        <div th:if="${param.error}" class="alerta-error mb-3">
            <i class="bi bi-exclamation-circle me-2"></i>
            Usuario o contraseña incorrectos.
        </div>
        <div th:if="${param.logout}" class="alerta-exito mb-3">
            <i class="bi bi-check-circle me-2"></i>
            Sesión cerrada correctamente.
        </div>
        <div th:if="${param.expired}" class="alerta-error mb-3">
            <i class="bi bi-clock me-2"></i>
            Tu sesión ha expirado. Inicia sesión nuevamente.
        </div>

        <!-- Formulario -->
        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <!-- Usuario -->
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-person-fill"></i>
                    </span>
                    <input type="text" name="username" class="form-control"
                           placeholder="Tu nombre de usuario"
                           autocomplete="username" autofocus required/>
                </div>
            </div>

            <!-- Contraseña -->
            <div class="mb-4">
                <label class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-lock-fill"></i>
                    </span>
                    <input type="password" name="password" id="inputPassword"
                           class="form-control" placeholder="Tu contraseña"
                           autocomplete="current-password" required/>
                    <button type="button" class="btn-ojo" onclick="togglePass()">
                        <i class="bi bi-eye" id="iconOjo"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-ingresar">
                <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar al sistema
            </button>
        </form>

        <hr class="divisor"/>

        <div class="badge-aviso mb-3">
            <i class="bi bi-shield-lock me-1"></i>
            Acceso restringido — Solo personal autorizado
        </div>

        <div class="text-center">
            <a th:href="@{/inicio}" class="link-volver">
                <i class="bi bi-arrow-left"></i> Volver a la tienda
            </a>
        </div>
    </div>

    <p class="pie">&copy; 2026 Licorería. Todos los derechos reservados.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePass() {
    const input = document.getElementById('inputPassword');
    const icon  = document.getElementById('iconOjo');
    if (input.type === 'password') {
        input.type   = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        input.type   = 'password';
        icon.className = 'bi bi-eye';
    }
}
</script>
</body>
</html>
