<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{publica/layout :: layout(
          titulo='Catálogo | Licorería',
          paginaActual='catalogo',
          contenido=~{::main-content},
          estilosExtra=~{},
          scriptsExtra=~{})}">
<head><title>Catálogo</title></head>
<body>
<th:block th:fragment="main-content">

    <!-- ── Breadcrumb ────────────────────────────────────────────────────── -->
    <div class="bg-light border-bottom py-2">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0 small">
                    <li class="breadcrumb-item">
                        <a th:href="@{/inicio}" class="text-decoration-none">Inicio</a>
                    </li>
                    <li class="breadcrumb-item active">Catálogo de Productos</li>
                </ol>
            </nav>
        </div>
    </div>

    <div class="container py-4">
        <div class="row g-4">

            <!-- ── Sidebar filtros ──────────────────────────────────────── -->
            <div class="col-lg-3">
                <div class="card border-0 shadow-sm sticky-top" style="top:80px">
                    <div class="card-body">
                        <h6 class="fw-bold mb-3">
                            <i class="bi bi-funnel me-2 text-warning"></i>Filtrar
                        </h6>

                        <!-- Búsqueda -->
                        <form th:action="@{/catalogo}" method="get">
                            <input type="hidden" name="categoria" th:value="${categoriaId}"/>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Buscar</label>
                                <input type="search" name="q" class="form-control form-control-sm"
                                       placeholder="Nombre o marca..."
                                       th:value="${busqueda}"/>
                            </div>

                            <!-- Categorías -->
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Categoría</label>
                                <div th:each="cat : ${categorias}" class="form-check">
                                    <input class="form-check-input" type="radio"
                                           name="categoria" th:value="${cat.id}"
                                           th:id="'cat-' + ${cat.id}"
                                           th:checked="${cat.id == categoriaId}"/>
                                    <label class="form-check-label small"
                                           th:for="'cat-' + ${cat.id}"
                                           th:text="${cat.nombre}">Categoría</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio"
                                           name="categoria" value=""
                                           th:checked="${categoriaId == null}"/>
                                    <label class="form-check-label small">Todas</label>
                                </div>
                            </div>

                            <!-- Ordenar -->
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Ordenar por</label>
                                <select name="orden" class="form-select form-select-sm">
                                    <option value="nombre" th:selected="${orden == 'nombre'}">Nombre</option>
                                    <option value="precio_asc" th:selected="${orden == 'precio_asc'}">Precio: menor a mayor</option>
                                    <option value="precio_desc" th:selected="${orden == 'precio_desc'}">Precio: mayor a menor</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-warning btn-sm w-100">
                                <i class="bi bi-search me-1"></i>Aplicar filtros
                            </button>
                            <a th:href="@{/catalogo}" class="btn btn-outline-secondary btn-sm w-100 mt-2">
                                Limpiar filtros
                            </a>
                        </form>
                    </div>
                </div>
            </div>

            <!-- ── Grid de productos ────────────────────────────────────── -->
            <div class="col-lg-9">

                <!-- Cabecera resultados -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div>
                        <h5 class="fw-bold mb-0">
                            <span th:text="${categoriaActual != null ? categoriaActual : 'Todos los productos'}">
                                Todos los productos
                            </span>
                        </h5>
                        <small class="text-muted"
                               th:text="${#lists.size(productos)} + ' productos encontrados'">
                        </small>
                    </div>
                    <!-- Toggle vista -->
                    <div class="btn-group btn-group-sm">
                        <button class="btn btn-outline-secondary active" id="btn-grid">
                            <i class="bi bi-grid-3x3-gap"></i>
                        </button>
                        <button class="btn btn-outline-secondary" id="btn-list">
                            <i class="bi bi-list-ul"></i>
                        </button>
                    </div>
                </div>

                <!-- Grid -->
                <div class="row g-3" id="productos-grid">
                    <div th:each="producto : ${productos}" class="col-6 col-md-4">
                        <div class="card card-producto h-100 border-0 shadow-sm">
                            <span th:if="${producto.sinStock}"
                                  class="badge bg-danger position-absolute top-0 start-0 m-2 z-1">
                                Agotado
                            </span>
                            <span th:if="${producto.stockBajo and !producto.sinStock}"
                                  class="badge bg-warning text-dark position-absolute top-0 start-0 m-2 z-1">
                                Últimas unidades
                            </span>

                            <div class="card-img-container">
                                <img th:src="@{/images/productos/{id}.jpg(id=${producto.id})}"
                                     th:alt="${producto.nombre}"
                                     onerror="this.src='/images/producto-default.png'"
                                     class="card-img-top producto-img"/>
                            </div>

                            <div class="card-body p-3 d-flex flex-column">
                                <small class="text-muted text-uppercase fw-semibold small"
                                       th:text="${producto.categoriaNombre}"></small>
                                <h6 class="card-title fw-semibold mt-1 mb-1"
                                    th:text="${producto.nombre}"></h6>
                                <small class="text-muted"
                                       th:text="${producto.marca + ' · ' + producto.volumenMl + 'ml · ' + producto.gradoAlcohol + '°'}">
                                </small>

                                <div class="mt-auto pt-3 d-flex justify-content-between align-items-center">
                                    <span class="precio-producto"
                                          th:text="'S/. ' + ${#numbers.formatDecimal(producto.precioVenta,1,2)}">
                                    </span>
                                    <a th:href="@{/producto/{id}(id=${producto.id})}"
                                       class="btn btn-sm btn-warning">
                                        Ver detalle
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Estado vacío -->
                    <div th:if="${#lists.isEmpty(productos)}" class="col-12 text-center py-5">
                        <i class="bi bi-search fs-1 text-muted"></i>
                        <h6 class="text-muted mt-3">No se encontraron productos</h6>
                        <a th:href="@{/catalogo}" class="btn btn-warning btn-sm mt-2">
                            Ver todos los productos
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>

</th:block>
</body>
</html>
