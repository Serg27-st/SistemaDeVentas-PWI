<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{publica/layout :: layout(
        titulo='Mi perfil | Tu Licorería',
        paginaActual='mi-cuenta',
        contenido=~{::main-content},
        estilosExtra=~{::estilos},
        scriptsExtra=~{})}">
<head><title>Mi perfil</title>
<th:block th:fragment="estilos">
  <style>
    .cuenta-sidebar { background:#0d0d16; border-radius:16px; padding:1.5rem; }
    .cuenta-nav-link {
      display:flex; align-items:center; gap:.75rem; padding:.7rem 1rem;
      border-radius:8px; color:rgba(255,255,255,.7); text-decoration:none;
      font-weight:500; font-size:.9rem; transition:background .2s,color .2s;
    }
    .cuenta-nav-link:hover, .cuenta-nav-link.active { background:rgba(201,162,39,.12); color:#c9a227; }
    .cuenta-nav-link i { font-size:1.1rem; width:20px; text-align:center; }
    .form-label { font-weight:600; font-size:.875rem; color:#374151; }
    .form-control:focus { border-color:#c9a227; box-shadow:0 0 0 .2rem rgba(201,162,39,.15); }
    .form-control:disabled { background:#f9fafb; color:#6b7280; }
  </style>
</th:block>
</head>
<body>
<th:block th:fragment="main-content">
<div class="container py-5">
  <div class="row g-4">

    <!-- Sidebar -->
    <div class="col-lg-3">
      <div class="cuenta-sidebar">
        <div class="text-center mb-4">
          <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
               style="width:72px;height:72px;background:linear-gradient(135deg,#c9a227,#e8b93a);font-size:1.8rem;font-weight:700;color:#0d0d16;">
            <span th:text="${#strings.substring(cliente.nombre,0,1).toUpperCase()}">U</span>
          </div>
          <div class="fw-bold text-white" th:text="${cliente.nombreCompleto}">Nombre</div>
          <div class="small" style="color:rgba(255,255,255,.5);" th:text="${cliente.email}">email</div>
        </div>
        <nav class="d-flex flex-column gap-1">
          <a th:href="@{/mi-cuenta}" class="cuenta-nav-link"><i class="bi bi-grid"></i> Panel</a>
          <a th:href="@{/mi-cuenta/pedidos}" class="cuenta-nav-link"><i class="bi bi-bag"></i> Mis pedidos</a>
          <a th:href="@{/mi-cuenta/direcciones}" class="cuenta-nav-link"><i class="bi bi-geo-alt"></i> Direcciones</a>
          <a th:href="@{/mi-cuenta/perfil}" class="cuenta-nav-link active"><i class="bi bi-person-gear"></i> Mi perfil</a>
          <hr style="border-color:rgba(255,255,255,.1);margin:.5rem 0;"/>
          <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="cuenta-nav-link w-100 border-0 text-start"
                    style="background:none;color:rgba(255,100,100,.7);">
              <i class="bi bi-box-arrow-right"></i> Cerrar sesión
            </button>
          </form>
        </nav>
      </div>
    </div>

    <!-- Perfil -->
    <div class="col-lg-9">
      <h4 class="fw-bold mb-4" style="font-family:'Playfair Display',serif;">Mi perfil</h4>

      <!-- Alertas flash -->
      <div th:if="${exito}" class="alert alert-success d-flex gap-2 align-items-center mb-4">
        <i class="bi bi-check-circle-fill"></i><span th:text="${exito}">Ok</span>
      </div>
      <div th:if="${error}" class="alert alert-danger d-flex gap-2 align-items-center mb-4">
        <i class="bi bi-exclamation-circle-fill"></i><span th:text="${error}">Error</span>
      </div>

      <div class="bg-white rounded-3 border p-4 p-md-5">

        <form th:action="@{/mi-cuenta/perfil/actualizar}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <div class="row g-4">

            <div class="col-sm-6">
              <label class="form-label">Nombre *</label>
              <input type="text" name="nombre" class="form-control"
                     th:value="${cliente.nombre}" required/>
            </div>

            <div class="col-sm-6">
              <label class="form-label">Apellido *</label>
              <input type="text" name="apellido" class="form-control"
                     th:value="${cliente.apellido}" required/>
            </div>

            <div class="col-12">
              <label class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" th:value="${cliente.email}" disabled/>
              <div class="form-text">El correo no se puede cambiar ya que es tu usuario de acceso.</div>
            </div>

            <div class="col-sm-6">
              <label class="form-label">Teléfono</label>
              <input type="tel" name="telefono" class="form-control"
                     th:value="${cliente.telefono}" placeholder="+51 999 999 999"/>
            </div>

            <div class="col-sm-6">
              <label class="form-label">DNI</label>
              <div class="input-group"
                   th:with="numDoc=${cliente.cliente != null ? cliente.cliente.numeroDocumento : null},
                            esPlaceholder=${numDoc != null and #strings.startsWith(numDoc,'WEB-')}">
                <span class="input-group-text"><i class="bi bi-card-text"></i></span>
                <input type="text" name="dni" class="form-control"
                       th:value="${esPlaceholder ? '' : numDoc}"
                       placeholder="Ej: 12345678" maxlength="12"
                       pattern="[0-9A-Za-z]{6,12}"/>
                <span th:if="${!esPlaceholder and numDoc != null}"
                      class="input-group-text text-success" title="DNI registrado">
                  <i class="bi bi-check-circle-fill"></i>
                </span>
              </div>
              <div class="form-text"
                   th:if="${cliente.cliente != null and #strings.startsWith(cliente.cliente.numeroDocumento,'WEB-')}"
                   style="color:#d97706;">
                <i class="bi bi-exclamation-triangle me-1"></i>Aún no has registrado tu DNI.
              </div>
            </div>

            <div class="col-sm-6">
              <label class="form-label">Fecha de nacimiento</label>
              <input type="text" class="form-control"
                     th:value="${cliente.fechaNacimiento != null ?
                       #temporals.format(cliente.fechaNacimiento,'dd/MM/yyyy') : '—'}"
                     disabled/>
              <div class="form-text">La fecha de nacimiento no se puede modificar.</div>
            </div>

            <div class="col-sm-6">
              <label class="form-label">Miembro desde</label>
              <input type="text" class="form-control"
                     th:value="${#temporals.format(cliente.fechaRegistro,'dd/MM/yyyy')}"
                     disabled/>
            </div>

            <div class="col-12 pt-2">
              <button type="submit" class="btn px-4 py-2"
                      style="background:#c9a227;color:#0d0d16;font-weight:700;border-radius:8px;">
                <i class="bi bi-check-circle me-1"></i>Guardar cambios
              </button>
            </div>

          </div>
        </form>

      </div>
    </div>

  </div>
</div>
</th:block>
</body>
</html>
