<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{publica/layout :: layout(
        titulo='Mis direcciones | Tu Licorería',
        paginaActual='mi-cuenta',
        contenido=~{::main-content},
        estilosExtra=~{::estilos},
        scriptsExtra=~{})}">
<head><title>Mis direcciones</title>
<th:block th:fragment="estilos">
  <style>
    .cuenta-sidebar { background:#0d0d16; border-radius:16px; padding:1.5rem; }
    .cuenta-nav-link {
      display:flex; align-items:center; gap:.75rem; padding:.7rem 1rem;
      border-radius:8px; color:rgba(255,255,255,.7); text-decoration:none;
      font-weight:500; font-size:.9rem; transition:background .2s,color .2s;
    }
    .cuenta-nav-link:hover, .cuenta-nav-link.active { background:rgba(201,162,39,.12); color:#c9a227; }
    .cuenta-nav-link i { font-size:1.1rem; width:20px; text-align:center; }
    .dir-card {
      background:#fff; border-radius:12px; border:1px solid #f0f0f0;
      transition:box-shadow .2s;
    }
    .dir-card.default-card { border-color:#c9a227; box-shadow:0 0 0 2px rgba(201,162,39,.2); }
    .dir-card:hover { box-shadow:0 4px 16px rgba(0,0,0,.07); }
    .form-control:focus { border-color:#c9a227; box-shadow:0 0 0 .2rem rgba(201,162,39,.15); }
  </style>
</th:block>
</head>
<body>
<th:block th:fragment="main-content">
<div class="container py-5">
  <div class="row g-4">

    <!-- Sidebar -->
    <div class="col-lg-3">
      <div class="cuenta-sidebar">
        <div class="text-center mb-4">
          <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
               style="width:72px;height:72px;background:linear-gradient(135deg,#c9a227,#e8b93a);font-size:1.8rem;font-weight:700;color:#0d0d16;">
            <span th:text="${#strings.substring(cliente.nombre,0,1).toUpperCase()}">U</span>
          </div>
          <div class="fw-bold text-white" th:text="${cliente.nombreCompleto}">Nombre</div>
          <div class="small" style="color:rgba(255,255,255,.5);" th:text="${cliente.email}">email</div>
        </div>
        <nav class="d-flex flex-column gap-1">
          <a th:href="@{/mi-cuenta}" class="cuenta-nav-link"><i class="bi bi-grid"></i> Panel</a>
          <a th:href="@{/mi-cuenta/pedidos}" class="cuenta-nav-link"><i class="bi bi-bag"></i> Mis pedidos</a>
          <a th:href="@{/mi-cuenta/direcciones}" class="cuenta-nav-link active"><i class="bi bi-geo-alt"></i> Direcciones</a>
          <a th:href="@{/mi-cuenta/perfil}" class="cuenta-nav-link"><i class="bi bi-person-gear"></i> Mi perfil</a>
          <hr style="border-color:rgba(255,255,255,.1);margin:.5rem 0;"/>
          <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="cuenta-nav-link w-100 border-0 text-start"
                    style="background:none;color:rgba(255,100,100,.7);">
              <i class="bi bi-box-arrow-right"></i> Cerrar sesión
            </button>
          </form>
        </nav>
      </div>
    </div>

    <!-- Contenido -->
    <div class="col-lg-9">
      <h4 class="fw-bold mb-4" style="font-family:'Playfair Display',serif;">Mis direcciones de envío</h4>

      <!-- Alertas flash -->
      <div th:if="${exito}" class="alert alert-success d-flex gap-2 align-items-center mb-4">
        <i class="bi bi-check-circle-fill"></i><span th:text="${exito}">Ok</span>
      </div>
      <div th:if="${error}" class="alert alert-danger d-flex gap-2 align-items-center mb-4">
        <i class="bi bi-exclamation-circle-fill"></i><span th:text="${error}">Error</span>
      </div>

      <div class="row g-3 mb-5">

        <!-- Tarjetas de direcciones -->
        <div th:each="d : ${direcciones}" class="col-md-6">
          <div class="dir-card p-4" th:classappend="${d.esDefault} ? ' default-card'">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <div class="d-flex align-items-center gap-2">
                <span class="badge rounded-pill px-3 py-1 fw-semibold"
                      style="background:rgba(201,162,39,.12);color:#b45309;"
                      th:text="${d.alias}">Casa</span>
                <span th:if="${d.esDefault}" class="badge rounded-pill px-2 py-1"
                      style="background:rgba(16,185,129,.12);color:#065f46;font-size:.72rem;">
                  <i class="bi bi-star-fill me-1"></i>Predeterminada
                </span>
              </div>
            </div>

            <p class="fw-semibold mb-1 small" th:text="${d.direccionCompleta}">Dirección</p>
            <p class="text-muted small mb-0" th:if="${d.distrito}" th:text="${d.distrito}">Distrito</p>
            <p class="text-muted small mb-0" th:if="${d.referencia}"
               th:text="'Ref: ' + ${d.referencia}">Referencia</p>

            <div class="d-flex gap-2 mt-3">
              <form th:unless="${d.esDefault}"
                    th:action="@{/mi-cuenta/direcciones/default/{id}(id=${d.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-sm btn-outline-secondary"
                        style="font-size:.78rem;">
                  <i class="bi bi-star me-1"></i>Predeterminar
                </button>
              </form>
              <form th:action="@{/mi-cuenta/direcciones/eliminar/{id}(id=${d.id})}" method="post"
                    onsubmit="return confirm('¿Eliminar esta dirección?')">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-sm btn-outline-danger" style="font-size:.78rem;">
                  <i class="bi bi-trash"></i>
                </button>
              </form>
            </div>
          </div>
        </div>

        <!-- Sin direcciones -->
        <div th:if="${direcciones.isEmpty()}" class="col-12">
          <div class="text-center py-4 text-muted">
            <i class="bi bi-geo-alt" style="font-size:2.5rem;opacity:.4;"></i>
            <p class="mt-2 mb-0">No tienes direcciones guardadas aún.</p>
          </div>
        </div>

      </div>

      <!-- Formulario nueva dirección -->
      <div class="bg-white rounded-3 border p-4">
        <h6 class="fw-bold mb-4 d-flex align-items-center gap-2">
          <i class="bi bi-plus-circle" style="color:#c9a227;"></i>
          Agregar nueva dirección
        </h6>
        <form th:action="@{/mi-cuenta/direcciones/nueva}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div class="row g-3">
            <div class="col-sm-4">
              <label class="form-label fw-semibold small">Alias *</label>
              <select name="alias" class="form-select" required>
                <option value="">Seleccionar...</option>
                <option value="Casa">Casa</option>
                <option value="Trabajo">Trabajo</option>
                <option value="Otro">Otro</option>
              </select>
            </div>
            <div class="col-sm-8">
              <label class="form-label fw-semibold small">Dirección completa *</label>
              <input type="text" name="direccionCompleta" class="form-control"
                     placeholder="Ej: Av. Larco 1234, Miraflores" required/>
            </div>
            <div class="col-sm-6">
              <label class="form-label fw-semibold small">Distrito</label>
              <input type="text" name="distrito" class="form-control" placeholder="Ej: Miraflores"/>
            </div>
            <div class="col-sm-6">
              <label class="form-label fw-semibold small">Referencia</label>
              <input type="text" name="referencia" class="form-control"
                     placeholder="Ej: Frente al parque"/>
            </div>
            <div class="col-12">
              <button type="submit" class="btn px-4 py-2"
                      style="background:#c9a227;color:#0d0d16;font-weight:700;border-radius:8px;">
                <i class="bi bi-plus-circle me-1"></i>Guardar dirección
              </button>
            </div>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>
</th:block>
</body>
</html>
