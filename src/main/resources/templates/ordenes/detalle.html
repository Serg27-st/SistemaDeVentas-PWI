<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{admin/layout :: layout(
          titulo='Detalle Orden',
          currentPage='ordenes',
          content=~{::main-content},
          extraHead=~{},
          extraScripts=~{})}">
<head>
</head>
<body>
<main th:fragment="main-content">

    <div class="d-flex align-items-center justify-content-between mb-3">
        <h3 class="m-0" th:text="${'Orden ' + orden.numeroOrden}">Orden</h3>
        <div class="d-flex gap-2">
            <a th:href="@{/ordenes}" class="btn btn-outline-amber">Volver</a>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-md-6">
            <div class="card-dark h-100 p-3">
                <h6 class="mb-3">Resumen</h6>
                <div class="d-flex justify-content-between py-1">
                    <span class="text-muted">Proveedor</span>
                    <span th:text="${orden.proveedor != null ? orden.proveedor.razonSocial : '-'}"></span>
                </div>
                <div class="d-flex justify-content-between py-1">
                    <span class="text-muted">Fecha</span>
                    <span th:text="${orden.fecha} "></span>
                </div>
                <div class="d-flex justify-content-between py-1">
                    <span class="text-muted">Estado</span>
                    <span th:text="${orden.estado} "></span>
                </div>
                <hr/>
                <div class="d-flex justify-content-between">
                    <strong>Total</strong>
                    <strong th:text="${orden.total != null ? 'S/ ' + orden.total : 'S/ 0.00'}"></strong>
                </div>
            </div>
        </div>

        <div class="col-md-6" sec:authorize="hasAnyRole('ADMIN','ALMACEN')">
            <div class="card-dark h-100 p-3">
                <h6 class="mb-3">Acciones</h6>

                <form th:if="${orden.estado != null and orden.estado.name() == 'PENDIENTE'}" th:action="@{'/ordenes/' + ${orden.id} + '/recibir'}" method="post">
                    <label class="form-label">Comprobante proveedor</label>
                    <input class="form-control form-control-dark" name="comprobanteProveedor" type="text" required/>
                    <button type="submit" class="btn btn-amber w-100 mt-3">
                        <i class="bi bi-box-seam me-1"></i> Recibir mercadería
                    </button>
                </form>

                <div th:if="${orden.estado == null or orden.estado.name() != 'PENDIENTE'}" class="alert alert-secondary mb-0">
                    <small>Esta orden no está pendiente.</small>
                </div>
            </div>
        </div>

        <div class="col-12">
            <div class="card-dark">
                <h6 class="m-0 p-3">Detalle</h6>
                <div class="table-responsive px-3 pb-3">
                    <table class="table table-dark-custom table-hover mb-0">
                        <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Precio</th>
                            <th>Subtotal</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="d : ${orden.detalles}">
                            <td th:text="${d.producto != null ? d.producto.nombre : '-'}"></td>
                            <td th:text="${d.cantidadSolicitada}"></td>
                            <td th:text="${'S/ ' + d.precioUnitario}"></td>
                            <td th:text="${'S/ ' + d.subtotal}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(orden.detalles)}">
                            <td colspan="4" class="text-center text-muted py-4">Sin detalles.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</main>
</body>
</html>
