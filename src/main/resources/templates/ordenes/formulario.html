<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
    th:replace="~{admin/layout :: layout(
          titulo='Nueva Orden de Compra',
          currentPage='ordenes',
          content=~{::main-content},
          extraHead=~{},
          extraScripts=~{::extra-scripts})}">

<head>
</head>

<body>
    <main th:fragment="main-content">

        <div class="d-flex align-items-center gap-3 mb-4">
            <a th:href="@{/ordenes}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i>
            </a>
            <div>
                <h4 class="page-title mb-0">Nueva orden de compra</h4>
                <p class="text-muted mb-0 small">Registra una compra a proveedor</p>
            </div>
        </div>

        <form th:action="@{/ordenes/nueva}" method="post" id="formOrden">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="row g-4">

                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-dark text-white border-0 py-3">
                            <h6 class="mb-0 fw-semibold">
                                <i class="bi bi-info-circle me-2"></i>Datos generales
                            </h6>
                        </div>
                        <div class="card-body p-4">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    Proveedor <span class="text-danger">*</span>
                                </label>
                                <select name="proveedorId" class="form-select" required>
                                    <option value="">Selecciona un proveedor</option>
                                    <option th:each="prov : ${proveedores}" th:value="${prov.id}"
                                        th:text="${prov.razonSocial + ' — ' + prov.ruc}">
                                    </option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    Fecha entrega estimada
                                </label>
                                <input type="date" name="fechaEntregaEstimada" class="form-control"
                                    th:min="${#temporals.format(#temporals.createNow(),'yyyy-MM-dd')}" />
                            </div>

                            <div class="mb-0">
                                <label class="form-label fw-semibold">Observaciones</label>
                                <textarea name="observaciones" class="form-control" rows="3"
                                    placeholder="Notas adicionales sobre la orden..."></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm">
                        <div
                            class="card-header bg-dark text-white border-0 py-3 d-flex justify-content-between align-items-center">
                            <h6 class="mb-0 fw-semibold">
                                <i class="bi bi-box-seam me-2"></i>Productos a ordenar
                            </h6>
                            <button type="button" class="btn btn-warning btn-sm" onclick="agregarFila()">
                                <i class="bi bi-plus me-1"></i>Agregar producto
                            </button>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table align-middle mb-0" id="tablaDetalles">
                                    <thead class="bg-light">
                                        <tr>
                                            <th class="ps-3">Producto</th>
                                            <th style="width:110px">Cantidad</th>
                                            <th style="width:130px">Precio unit.</th>
                                            <th style="width:120px" class="text-end">Subtotal</th>
                                            <th style="width:50px"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="cuerpoDetalles">
                                    </tbody>
                                </table>
                            </div>

                            <div id="mensajeVacio" class="text-center py-4 text-muted">
                                <i class="bi bi-cart fs-2 d-block mb-2"></i>
                                <small>Agrega productos usando el botón de arriba</small>
                            </div>
                        </div>

                        <div class="card-footer bg-white border-top p-4">
                            <div class="row justify-content-end">
                                <div class="col-md-5">
                                    <div class="d-flex justify-content-between mb-1">
                                        <span class="text-muted">Subtotal</span>
                                        <span id="lblSubtotal">S/. 0.00</span>
                                    </div>
                                    <div class="d-flex justify-content-between mb-2">
                                        <span class="text-muted">IGV (18%)</span>
                                        <span id="lblIgv">S/. 0.00</span>
                                    </div>
                                    <div class="d-flex justify-content-between fw-bold fs-5 border-top pt-2">
                                        <span>Total</span>
                                        <span id="lblTotal" class="text-warning">S/. 0.00</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2 justify-content-end mt-3">
                        <a th:href="@{/ordenes}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-warning fw-semibold px-4" id="btnGuardar" disabled>
                            <i class="bi bi-clipboard-check me-2"></i>Crear orden
                        </button>
                    </div>
                </div>
            </div>
        </form>

        <div style="display: none;">
            <table id="tmplFila">
                <tbody>
                    <tr>
                        <td class="ps-3">
                            <select name="detalles[__IDX__].productoId" class="form-select form-select-sm sel-producto"
                                onchange="calcularFila(this)" required>
                                <option value="">Selecciona producto</option>
                                <option th:each="p : ${productos}" th:value="${p.id}"
                                    th:text="${p.nombre + ' (' + p.volumenMl + 'ml)'}"
                                    th:data-precio="${p.precioCompra}">
                                </option>
                            </select>
                        </td>
                        <td>
                            <input type="number" name="detalles[__IDX__].cantidadSolicitada"
                                class="form-control form-control-sm inp-cantidad" value="1" min="1"
                                onchange="calcularFila(this)" />
                        </td>
                        <td>
                            <div class="input-group input-group-sm">
                                <span class="input-group-text">S/.</span>
                                <input type="number" name="detalles[__IDX__].precioUnitario"
                                    class="form-control inp-precio" step="0.01" min="0" onchange="calcularFila(this)" />
                            </div>
                        </td>
                        <td class="text-end fw-semibold lbl-subtotal">S/. 0.00</td>
                        <td class="text-center">
                            <button type="button" class="btn btn-sm btn-outline-danger" onclick="eliminarFila(this)">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

    <th:block th:fragment="extra-scripts">
        <script>
            let indice = 0;

            // Lista de precios de compra por productoId para autocompletar
            const precios = {};
            document.querySelectorAll('#tmplFila option[data-precio]').forEach(opt => {
                precios[opt.value] = parseFloat(opt.dataset.precio) || 0;
            });

            function agregarFila() {
                // Buscamos el contenido del tbody de nuestra tabla oculta
                const tmpl = document.querySelector('#tmplFila tbody');
                const html = tmpl.innerHTML.replaceAll('__IDX__', indice++);
                const tbody = document.getElementById('cuerpoDetalles');
                const tr = document.createElement('tr');
                tr.innerHTML = html;

                tbody.appendChild(tr);
                document.getElementById('mensajeVacio').style.display = 'none';
                actualizarBtnGuardar();
                recalcularTotales();
            }

            function eliminarFila(btn) {
                btn.closest('tr').remove();
                const tbody = document.getElementById('cuerpoDetalles');
                if (tbody.children.length === 0) {
                    document.getElementById('mensajeVacio').style.display = '';
                }
                actualizarBtnGuardar();
                recalcularTotales();
            }

            function calcularFila(input) {
                const fila = input.closest('tr');
                const sel = fila.querySelector('.sel-producto');
                const cantidad = parseFloat(fila.querySelector('.inp-cantidad').value) || 0;
                let precio = parseFloat(fila.querySelector('.inp-precio').value) || 0;

                // Auto-completar precio de compra al seleccionar producto
                if (input.classList.contains('sel-producto') && sel.value) {
                    precio = precios[sel.value] || 0;
                    fila.querySelector('.inp-precio').value = precio.toFixed(2);
                }

                const subtotal = cantidad * precio;
                fila.querySelector('.lbl-subtotal').textContent = 'S/. ' + subtotal.toFixed(2);

                recalcularTotales();
            }

            function recalcularTotales() {
                let subtotal = 0;
                document.querySelectorAll('.lbl-subtotal').forEach(lbl => {
                    subtotal += parseFloat(lbl.textContent.replace('S/. ', '')) || 0;
                });
                const igv = subtotal * 0.18;
                const total = subtotal + igv;

                document.getElementById('lblSubtotal').textContent = 'S/. ' + subtotal.toFixed(2);
                document.getElementById('lblIgv').textContent = 'S/. ' + igv.toFixed(2);
                document.getElementById('lblTotal').textContent = 'S/. ' + total.toFixed(2);
            }

            function actualizarBtnGuardar() {
                const filas = document.querySelectorAll('#cuerpoDetalles tr');
                document.getElementById('btnGuardar').disabled = filas.length === 0;
            }

            // Validar antes de enviar
            document.getElementById('formOrden').addEventListener('submit', function (e) {
                const filas = document.querySelectorAll('#cuerpoDetalles tr');
                if (filas.length === 0) {
                    e.preventDefault();
                    alert('Debes agregar al menos un producto a la orden.');
                }
            });
        </script>
    </th:block>
</body>

</html>
