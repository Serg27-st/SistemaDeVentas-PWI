<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{admin/layout :: layout(
          titulo='Kardex',
          currentPage='kardex',
          content=~{::main-content},
          extraHead=~{},
          extraScripts=~{})}">
<head>
</head>
<body>
<main th:fragment="main-content">

    <div class="d-flex align-items-center justify-content-between mb-3">
        <h3 class="m-0">Kardex</h3>
        <form class="d-flex gap-2" method="get" th:action="@{/kardex}">
            <div>
                <label class="form-label">Inicio</label>
                <input type="datetime-local" class="form-control form-control-dark" name="inicio" th:value="${inicio}"/>
            </div>
            <div>
                <label class="form-label">Fin</label>
                <input type="datetime-local" class="form-control form-control-dark" name="fin" th:value="${fin}"/>
            </div>
            <div class="align-self-end">
                <button class="btn btn-amber" type="submit">
                    <i class="bi bi-search me-1"></i> Filtrar
                </button>
            </div>
        </form>
    </div>

    <div class="card-dark">
        <div class="table-responsive px-3 pb-3">
            <table class="table table-dark-custom table-hover mb-0">
                <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Producto</th>
                    <th>Tipo movimiento</th>
                    <th>Cantidad</th>
                    <th>Saldo</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m : ${movimientos}">
                    <td th:text="${m.fecha != null ? m.fecha : '-'}">--</td>
                    <td th:text="${m.producto != null ? m.producto.nombre : '-'}">Producto</td>
                    <td th:text="${m.tipoMovimiento != null ? m.tipoMovimiento : '-'}">MOV</td>
                    <td th:text="${m.cantidad}">0</td>
                    <td th:text="${m.saldo}">0</td>
                </tr>
                <tr th:if="${#lists.isEmpty(movimientos)}">
                    <td colspan="5" class="text-center text-muted py-4">No hay movimientos en el rango seleccionado.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>
</body>
</html>
