<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{admin/layout :: layout(
          titulo='Historial Kardex',
          currentPage='kardex',
          content=~{::main-content},
          extraHead=~{},
          extraScripts=~{})}">
<head>
</head>
<body>
<main th:fragment="main-content">

    <div class="d-flex align-items-center justify-content-between mb-3">
        <h3 class="m-0" th:text="${'Kardex - ' + producto.nombre}">Kardex</h3>
        <a th:href="@{/kardex}" class="btn btn-outline-amber">Volver</a>
    </div>

    <div class="card-dark">
        <div class="table-responsive px-3 pb-3">
            <table class="table table-dark-custom table-hover mb-0">
                <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Detalle</th>
                    <th>Cantidad</th>
                    <th>Saldo</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m : ${movimientos}">
                    <td th:text="${m.fecha != null ? m.fecha : '-'}">--</td>
                    <td th:text="${m.detalle != null ? m.detalle : (m.tipoMovimiento != null ? m.tipoMovimiento : '-')}">DET</td>
                    <td th:text="${m.cantidad}">0</td>
                    <td th:text="${m.saldo}">0</td>
                </tr>
                <tr th:if="${#lists.isEmpty(movimientos)}">
                    <td colspan="4" class="text-center text-muted py-4">No hay historial para este producto.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>
</body>
</html>
