<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      th:replace="~{admin/layout :: layout(
          titulo='Clientes',
          currentPage='clientes',
          content=~{::main-content},
          extraHead=~{},
          extraScripts=~{})}">
<head>
</head>
<body>
<main th:fragment="main-content">

    <div class="d-flex align-items-center justify-content-between mb-3">
        <h3 class="m-0">Clientes</h3>
        <a th:href="@{/clientes/nuevo}" class="btn btn-amber" sec:authorize="hasAnyRole('ADMIN','VENDEDOR')">
            <i class="bi bi-plus-lg me-1"></i> Nuevo Cliente
        </a>
    </div>

    <div class="card-dark">
        <div class="table-responsive">
            <table class="table table-dark-custom table-hover mb-0">
                <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Documento</th>
                    <th>Teléfono</th>
                    <th>Correo</th>
                    <th>Dirección</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${clientes}">
                    <td th:text="${c.nombre + ' ' + c.apellido}">Nombre</td>
                    <td th:text="${c.tipoDocumento + ': ' + c.numeroDocumento}">DOC</td>
                    <td th:text="${c.telefono != null ? c.telefono : '-'}">-</td>
                    <td th:text="${c.correo != null ? c.correo : '-'}">-</td>
                    <td th:text="${c.direccion != null ? c.direccion : '-'}">-</td>
                    <td class="text-end">
                        <a th:href="@{'/clientes/' + ${c.id}}" class="btn btn-outline-amber btn-sm">
                            <i class="bi bi-eye"></i>
                        </a>
                        <a th:href="@{'/clientes/editar/' + ${c.id}}" class="btn btn-outline-amber btn-sm ms-1" sec:authorize="hasAnyRole('ADMIN','VENDEDOR')">
                            <i class="bi bi-pencil"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(clientes)}">
                    <td colspan="6" class="text-center text-muted py-4">No hay clientes.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>
</body>
</html>
